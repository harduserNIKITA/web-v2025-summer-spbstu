<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> /* думаю можно убрать */
    <title>Блог постов</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Блог постов</h1>
    </header>

    <main>
        <section class="controls">
            <button id="addPostBtn" class="btn">Добавить пост</button>
            <button id="showStatsBtn" class="btn">Статистика</button>
        </section>

        <section id="postForm" class="form-container hidden">
            <h2>Новый пост</h2>
            <div class="form-group">
                <label for="postTitle">Заголовок:</label>
                <input type="text" id="postTitle" required>
            </div>
            <div class="form-group">
                <label for="postTags">Теги (через запятую):</label>
                <input type="text" id="postTags">
            </div>
            <button id="submitPostBtn" class="btn">Сохранить</button>
        </section>

        <section id="stats" class="stats hidden">
            <h2>Статистика</h2>
            <div id="tagsStats"></div>
            <div id="commentsStats"></div>
        </section>

        <section id="postsContainer" class="posts-container"></section>
    </main>

    <script src="BlogPost.js"></script>
    <script src="BlogStorage.js"></script>
    <script src="BlogStats.js"></script>
    <script src="BlogUI.js"></script>
    <script src="main.js"></script>
</body>

</html>
